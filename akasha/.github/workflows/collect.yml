name: collect-field

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-field
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect field snapshot
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
        run: python scripts/collect.py
      - name: Commit fossil
        run: |
          git config user.name "akasha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add field/
          if git diff --cached --quiet; then
            echo "nothing to fossilize"
          else
            git commit -m "field: $(date -u +%Y-%m-%dT%H:%M)Z"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
